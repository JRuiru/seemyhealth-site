name: Deploy

on:
  push:
    branches: [main]

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Detect what changed
        uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            site:
              - 'src/**'
              - 'public/**'
              - 'astro.config.mjs'
              - 'tsconfig.json'
              - 'package.json'
              - 'package-lock.json'
              - '.github/workflows/deploy.yml'
            bff:
              - 'workers/bff/**'
              - '.github/workflows/deploy.yml'

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # ---- Site ----
      - name: Install dependencies
        if: steps.filter.outputs.site == 'true'
        run: npm ci

      - name: Security audit
        if: steps.filter.outputs.site == 'true'
        run: npm audit --audit-level=critical

      - name: Typecheck site
        if: steps.filter.outputs.site == 'true'
        run: npm run check

      - name: Build site
        if: steps.filter.outputs.site == 'true'
        run: npm run build

      - name: Assert no source maps in client bundle
        if: steps.filter.outputs.site == 'true'
        run: |
          if find dist/client -name '*.map' | grep -q .; then
            echo "::error::Source maps found in dist/client — see CLAUDE.md (Client Bundle Security)"
            find dist/client -name '*.map'
            exit 1
          fi
          echo "No source maps in client bundle."

      - name: Deploy Pages
        if: steps.filter.outputs.site == 'true'
        run: npx wrangler pages deploy dist/client --project-name=seemyhealth-site --commit-dirty=true
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ---- BFF Worker ----
      - name: Install BFF dependencies
        if: steps.filter.outputs.bff == 'true'
        run: npm ci
        working-directory: workers/bff

      - name: Typecheck BFF Worker
        if: steps.filter.outputs.bff == 'true'
        run: npm run typecheck
        working-directory: workers/bff

      - name: Deploy BFF Worker
        if: steps.filter.outputs.bff == 'true'
        run: npx wrangler deploy -c wrangler.jsonc
        working-directory: workers/bff
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

      # ---- Verify ----
      - name: Smoke test
        if: steps.filter.outputs.site == 'true' || steps.filter.outputs.bff == 'true'
        run: |
          set -euo pipefail
          check() {
            local url="$1" expect="$2" attempt=1
            while [ "$attempt" -le 6 ]; do
              code=$(curl -sL -o /dev/null -w '%{http_code}' --max-time 20 "$url" || echo 000)
              if [ "$code" = "$expect" ]; then
                echo "  ok  $url -> $code"
                return 0
              fi
              echo "  ... $url -> $code (attempt $attempt/6)"
              attempt=$((attempt + 1))
              sleep 10
            done
            echo "::error::Smoke test failed: $url returned $code, expected $expect"
            return 1
          }
          check https://www.seemyhealth.ai/ 200
          check https://www.seemyhealth.ai/shop 200
          check https://www.seemyhealth.ai/products/ring-one 200
          check https://www.seemyhealth.ai/api/health 200

      - name: Skipped
        if: steps.filter.outputs.site != 'true' && steps.filter.outputs.bff != 'true'
        run: echo "No site or worker changes — nothing to deploy."
